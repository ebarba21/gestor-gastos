<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <!-- iPhone/iPad: al anadirla a la pantalla de inicio se abre a pantalla completa, como una app,
         con la barra de estado sobre el contenido (las zonas seguras las respeta el CSS). -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Gestor de gastos personales local-first, con sincronizacion privada opcional." />
    <title>Gestor de Gastos</title>
    <!-- Fija el tema (oscuro/claro) antes del primer render para evitar el parpadeo inicial.
         Local y sin red: solo lee localStorage y la preferencia del sistema. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('gg-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.theme = t;
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
